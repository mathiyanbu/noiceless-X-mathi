# SIH26052 — NOICELESSX: Raspberry Pi 4/5 Deployment Configuration
# Target: Raspberry Pi OS 64-bit (Debian 12), VoiceHAT single-microphone capture

audio:
  sample_rate: 16000
  channels: 1
  hardware_sample_rate: 48000
  hardware_channels: 2
  frame_ms: 10
  hop_ms: 5
  fft_size: 512
  # VoiceHAT: S32_LE / 48 kHz / 2 channels. The runtime keeps channel 0 only.
  input_device: "hw:CARD=sndrpigooglevoi,DEV=0"
  reference_device: "disabled"
  single_mic: true
  # USB PnP Sound Device (card 3, stable ALSA card name "Device"). The plug
  # plugin converts the internal mono 16 kHz stream for the USB stereo device.
  output_device: "plughw:CARD=Device,DEV=0"
  buffer_frames: 160
  periods: 4

ai:
  model_path: "models/onnx/speech_enhancer_int8.onnx"
  execution_provider: "CPUExecutionProvider"
  intra_op_num_threads: 2
  inter_op_num_threads: 1
  enable_neon_simd: true

nlms:
  # No physical reference microphone is installed for this deployment.
  enabled: false
  filter_length: 256
  learning_rate: 0.05
  step_size: 0.05
  epsilon: 1e-6
  eps: 1e-6
  leakage: 0.0001

impulse:
  enabled: true
  use_onnx: false
  model_path: "models/onnx/impulse_detector.onnx"
  threshold_on: 0.65
  threshold_off: 0.35
  attack_alpha: 0.80
  release_alpha: 0.15
  weights:
    rms: 1.2
    spectral_flux: 0.001
    crest_factor: 3.5
    zcr: -2.0
    band_low: -0.5
    band_mid_low: -0.3
    band_mid_high: 1.0
    band_high: 3.0
    bias: -14.0

fusion:
  spectral_alpha: 0.7
  smoothing_factor: 0.9

diagnostics:
  thermal_cmd: "vcgencmd measure_temp"
  target_latency_ms: 15.0
  max_acceptable_cpu_pct: 75.0

telemetry:
  host: "0.0.0.0"
  port: 8000
  ws_endpoint: "/ws/telemetry"
  push_interval_ms: 50
