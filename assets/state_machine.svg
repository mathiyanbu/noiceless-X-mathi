<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="sm-glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="sm-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="sm-glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="sm-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="sm-arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="sm-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    @keyframes pulseRing {
      0%, 100% { transform: scale(1.0); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1.0; }
    }
    @keyframes transitFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .active-state {
      animation: pulseRing 3s ease-in-out infinite;
      transform-origin: center;
    }
    .transit-dash {
      stroke-dasharray: 5 4;
      animation: transitFlow 1.5s linear infinite;
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="940" height="400" rx="14" fill="url(#sm-bg)" />
  <rect x="2" y="2" width="936" height="396" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 34)">
    <text x="0" y="0" fill="#38bdf8" font-size="18" font-weight="900" letter-spacing="1">HYBRID FUSION CONTROLLER: 6-STATE REAL-TIME FAULT MACHINE</text>
    <text x="0" y="20" fill="#94a3b8" font-size="12">Automatic Dynamic Failover, Microsecond Transient Protection &amp; Hardware Resilience</text>
  </g>

  <!-- ==================== STATE NODES ==================== -->

  <!-- 1. NORMAL STATE (Center Primary) -->
  <g transform="translate(370, 95)" class="active-state">
    <rect x="0" y="0" width="200" height="95" rx="10" fill="#06281e" stroke="#10b981" stroke-width="2" filter="url(#sm-glow-green)" />
    <circle cx="18" cy="22" r="5" fill="#10b981" />
    <text x="32" y="26" fill="#34d399" font-size="13" font-weight="800">STATE: NORMAL</text>
    <text x="14" y="48" fill="#d1fae5" font-size="10.5" font-weight="600">Dual-Path Active Blending</text>
    <text x="14" y="65" fill="#a7f3d0" font-size="9.5" font-family="monospace">S = λ(t)·S_ai + (1-λ(t))·S_nlms</text>
    <text x="14" y="82" fill="#6ee7b7" font-size="9.5">Full AI Mask + Sub-ms NLMS</text>
  </g>

  <!-- 2. IMPULSE_PROTECT STATE (Top Center-Right) -->
  <g transform="translate(680, 95)">
    <rect x="0" y="0" width="210" height="95" rx="10" fill="#290b16" stroke="#f43f5e" stroke-width="2" filter="url(#sm-glow-rose)" />
    <circle cx="18" cy="22" r="5" fill="#f43f5e" />
    <text x="32" y="26" fill="#fb7185" font-size="13" font-weight="800">IMPULSE_PROTECT</text>
    <text x="14" y="48" fill="#ffe4e6" font-size="10.5" font-weight="600">Transient Clamping Envelope</text>
    <text x="14" y="65" fill="#fecdd3" font-size="9.5">Fast Attack (&lt;100µs), Exp Decay</text>
    <text x="14" y="82" fill="#f43f5e" font-size="9.5" font-family="monospace">g_transient floor = 0.05 (-26dB)</text>
  </g>

  <!-- 3. DEGRADED STATE (Bottom Right) -->
  <g transform="translate(680, 245)">
    <rect x="0" y="0" width="210" height="90" rx="10" fill="#241908" stroke="#f59e0b" stroke-width="1.8" filter="url(#sm-glow-amber)" />
    <circle cx="18" cy="22" r="4.5" fill="#f59e0b" />
    <text x="32" y="26" fill="#fbbf24" font-size="12.5" font-weight="800">DEGRADED (NLMS-ONLY)</text>
    <text x="14" y="48" fill="#fef3c7" font-size="10.5" font-weight="600">AI Latency Timeout / Overrun</text>
    <text x="14" y="65" fill="#d97706" font-size="9.5" font-family="monospace">λ = 0.0 | Pure Linear Filter</text>
    <text x="14" y="80" fill="#f59e0b" font-size="9">Zero buffer dropouts guaranteed</text>
  </g>

  <!-- 4. NLMS_FAULT STATE (Bottom Center) -->
  <g transform="translate(370, 245)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#1e1035" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="18" cy="22" r="4.5" fill="#c084fc" />
    <text x="32" y="26" fill="#c084fc" font-size="12.5" font-weight="800">NLMS_FAULT (AI-ONLY)</text>
    <text x="14" y="48" fill="#f3e8ff" font-size="10.5" font-weight="600">Filter Divergence / Leakage</text>
    <text x="14" y="65" fill="#a855f7" font-size="9.5" font-family="monospace">λ = 1.0 | Pure Neural Mask</text>
    <text x="14" y="80" fill="#d8b4fe" font-size="9">Protects speech cancellation</text>
  </g>

  <!-- 5. BYPASS STATE (Top Left) -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="200" height="95" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5" />
    <circle cx="18" cy="22" r="4.5" fill="#94a3b8" />
    <text x="32" y="26" fill="#cbd5e1" font-size="12.5" font-weight="800">STATE: BYPASS</text>
    <text x="14" y="48" fill="#e2e8f0" font-size="10.5" font-weight="600">Direct Pass-Through Mode</text>
    <text x="14" y="65" fill="#94a3b8" font-size="9.5">Primary Mic Audio Passthrough</text>
    <text x="14" y="82" fill="#64748b" font-size="9" font-family="monospace">Latency: &lt; 0.05 ms</text>
  </g>

  <!-- 6. ERROR STATE (Bottom Left) -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="#240c0c" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="18" cy="22" r="4.5" fill="#dc2626" />
    <text x="32" y="26" fill="#f87171" font-size="12.5" font-weight="800">STATE: ERROR</text>
    <text x="14" y="48" fill="#fee2e2" font-size="10.5" font-weight="600">Hardware ALSA Disconnect</text>
    <text x="14" y="65" fill="#fca5a5" font-size="9.5">Safe Mute / Output Clamp</text>
    <text x="14" y="80" fill="#ef4444" font-size="9">Prevents acoustic feedback squeal</text>
  </g>

  <!-- ==================== TRANSITIONS ==================== -->

  <!-- NORMAL -> IMPULSE_PROTECT (Forward) -->
  <path d="M 570 125 L 680 125" fill="none" stroke="#f43f5e" stroke-width="2" class="transit-dash" marker-end="url(#sm-arrow-rose)" />
  <text x="580" y="118" fill="#fb7185" font-size="9.5" font-weight="700">Impulse Triggered</text>

  <!-- IMPULSE_PROTECT -> NORMAL (Return) -->
  <path d="M 680 160 L 570 160" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#sm-arrow-green)" />
  <text x="590" y="174" fill="#34d399" font-size="9">Envelope Decay Complete</text>

  <!-- NORMAL -> DEGRADED (Downward Right) -->
  <path d="M 540 190 L 540 215 L 750 215 L 750 245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#sm-arrow)" />
  <text x="595" y="210" fill="#fbbf24" font-size="9">AI Latency &gt; 5.0ms</text>

  <!-- NORMAL -> NLMS_FAULT (Downward) -->
  <path d="M 450 190 L 450 245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#sm-arrow)" />
  <text x="456" y="222" fill="#c084fc" font-size="9">NLMS Divergence</text>

  <!-- NORMAL -> BYPASS (Leftward) -->
  <path d="M 370 142 L 260 142" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#sm-arrow)" />
  <text x="280" y="135" fill="#94a3b8" font-size="9">Manual / Mute</text>

  <!-- ANY -> ERROR (Leftward to Error) -->
  <path d="M 370 290 L 260 290" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#sm-arrow)" />
  <text x="272" y="282" fill="#f87171" font-size="9">Hardware ALSA Crash</text>

  <!-- Footer -->
  <g transform="translate(40, 375)">
    <text x="0" y="0" fill="#64748b" font-size="10.5">HYSTERESIS ENGINE: Anti-Chattering Hold (50 frames) • Exponential Decay Factor: 0.85/frame • Fast-Attack Gain Floor: 0.05 (-26.0 dB)</text>
  </g>
</svg>
