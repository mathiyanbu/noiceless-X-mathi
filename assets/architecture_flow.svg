<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="flow-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141f36" stroke-width="0.7" opacity="0.5" />
    </pattern>

    <!-- Marker Arrowheads -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00f0ff" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .flow-dash-cyan {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.2s linear infinite;
    }
    .flow-dash-amber {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.4s linear infinite;
    }
    .flow-dash-rose {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.0s linear infinite;
    }
    .flow-dash-purple {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.6s linear infinite;
    }
    .flow-dash-emerald {
      stroke-dasharray: 6 5;
      animation: pulseDash 1.1s linear infinite;
    }
    .status-blink {
      animation: nodeBlink 2s ease-in-out infinite;
    }
    text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }
  </style>

  <!-- Background Base -->
  <rect width="1060" height="560" rx="16" fill="url(#flow-bg)" />
  <rect width="1060" height="560" rx="16" fill="url(#flow-grid)" />
  <rect x="2" y="2" width="1056" height="556" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(40, 36)">
    <text x="0" y="0" fill="#38bdf8" font-size="20" font-weight="900" letter-spacing="1">NOICELESS-X: COMPLETE END-TO-END HYBRID SIGNAL ARCHITECTURE</text>
    <text x="0" y="20" fill="#94a3b8" font-size="12" font-weight="500">
      Dual-Microphone ALSA Ingestion • Sub-Millisecond NLMS • Microsecond TinyImpulseMLP • ComplexCRN Deep Masking • Fusion Controller
    </text>
  </g>

  <!-- ==================== COLUMN 1: HARDWARE MICROPHONE INGESTION ==================== -->
  <g transform="translate(40, 85)">
    <!-- Primary Mic Node -->
    <rect x="0" y="0" width="160" height="90" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="15" cy="18" r="4" fill="#00f0ff" class="status-blink" />
    <text x="26" y="22" fill="#00f0ff" font-size="12" font-weight="800">PRIMARY MIC</text>
    <text x="12" y="44" fill="#e2e8f0" font-size="10.5" font-weight="600">Headset / Boom</text>
    <text x="12" y="60" fill="#94a3b8" font-size="10">s[n] + v[n] (Speech+Noise)</text>
    <text x="12" y="76" fill="#38bdf8" font-size="9" font-family="monospace">16 kHz / 16-bit PCM</text>

    <!-- Reference Mic Node -->
    <rect x="0" y="115" width="160" height="90" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="15" cy="133" r="4" fill="#38bdf8" class="status-blink" />
    <text x="26" y="137" fill="#38bdf8" font-size="12" font-weight="800">REFERENCE MIC</text>
    <text x="12" y="159" fill="#e2e8f0" font-size="10.5" font-weight="600">Error / Ambient Mic</text>
    <text x="12" y="175" fill="#94a3b8" font-size="10">d[n] (Acoustic Noise)</text>
    <text x="12" y="191" fill="#38bdf8" font-size="9" font-family="monospace">Hardware ALSA hw:1,0</text>

    <!-- Zero-Copy Ring Buffer Node -->
    <rect x="0" y="235" width="160" height="85" rx="8" fill="#111c33" stroke="#64748b" stroke-width="1.2" />
    <text x="14" y="258" fill="#cbd5e1" font-size="11.5" font-weight="800">LOCK-FREE SPSC</text>
    <text x="14" y="276" fill="#94a3b8" font-size="10">Circular Ring Buffers</text>
    <text x="14" y="294" fill="#94a3b8" font-size="10">Atomic Read/Write Ptrs</text>
    <text x="14" y="310" fill="#00f0ff" font-size="9" font-family="monospace">5.0ms Hop (80 samples)</text>
  </g>

  <!-- Connectors from Column 1 to Column 2 -->
  <path d="M 200 130 L 250 130" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 200 245 L 250 245" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 200 370 L 250 370" fill="none" stroke="#00f0ff" stroke-width="2" class="flow-dash-cyan" marker-end="url(#arrow-cyan)" />

  <!-- ==================== COLUMN 2: THREE-WAY PARALLEL ENGINE ==================== -->
  
  <!-- PATH 1: CLASSICAL DSP (NLMS) -->
  <g transform="translate(250, 85)">
    <rect x="0" y="0" width="220" height="110" rx="8" fill="#1c1608" stroke="#f59e0b" stroke-width="1.8" filter="url(#glow-amber)" />
    <circle cx="16" cy="20" r="4" fill="#f59e0b" />
    <text x="28" y="24" fill="#fbbf24" font-size="12.5" font-weight="800">PATH 1: DUAL-MIC NLMS</text>
    <text x="14" y="46" fill="#fef3c7" font-size="10.5" font-weight="600">Normalized Least Mean Squares</text>
    <text x="14" y="64" fill="#d97706" font-size="9.5" font-family="monospace">w[n+1] = w[n] + (μ/||x||²) e[n]x[n]</text>
    <text x="14" y="82" fill="#d1d5db" font-size="10">Decorrelated Ref • Sub-ms Cancel</text>
    <text x="14" y="98" fill="#f59e0b" font-size="9.5" font-weight="700">Latency: &lt; 0.12 ms (ARM NEON)</text>
  </g>

  <!-- PATH 2: MICROSECOND IMPULSE DETECTOR -->
  <g transform="translate(250, 215)">
    <rect x="0" y="0" width="220" height="115" rx="8" fill="#240e16" stroke="#f43f5e" stroke-width="1.8" filter="url(#glow-rose)" />
    <circle cx="16" cy="20" r="4" fill="#f43f5e" />
    <text x="28" y="24" fill="#fb7185" font-size="12.5" font-weight="800">PATH 2: IMPULSE DETECTOR</text>
    <text x="14" y="46" fill="#ffe4e6" font-size="10.5" font-weight="600">8-D Physical Acoustic Features</text>
    <text x="14" y="64" fill="#fda4af" font-size="9.5">RMS • Flux • Crest • ZCR • 4 Subbands</text>
    <text x="14" y="82" fill="#f43f5e" font-size="10" font-weight="700">TinyImpulseMLP (305 Parameters)</text>
    <text x="14" y="100" fill="#fb7185" font-size="9.5" font-weight="700">Latency: &lt; 5 µs • 100% Precision</text>
  </g>

  <!-- PATH 3: DEEP LEARNING (COMPLEX-CRN) -->
  <g transform="translate(250, 350)">
    <rect x="0" y="0" width="220" height="155" rx="8" fill="#1e1035" stroke="#a855f7" stroke-width="1.8" filter="url(#glow-purple)" />
    <circle cx="16" cy="20" r="4" fill="#c084fc" />
    <text x="28" y="24" fill="#c084fc" font-size="12.5" font-weight="800">PATH 3: ComplexCRN NEURAL</text>
    <text x="14" y="46" fill="#f3e8ff" font-size="10.5" font-weight="600">Complex Conv2D Encoder (Real/Imag)</text>
    <text x="14" y="64" fill="#e9d5ff" font-size="10">Paired Complex GRU (Persistent State)</text>
    <text x="14" y="82" fill="#e9d5ff" font-size="10">Transpose Conv2D U-Net Decoder</text>
    <text x="14" y="100" fill="#a855f7" font-size="9.5" font-family="monospace">Bounded Mask: M_hat = M_R + jM_I</text>
    <text x="14" y="118" fill="#d8b4fe" font-size="10">Enhanced STFT: S_hat = M_hat * X</text>
    <text x="14" y="136" fill="#38bdf8" font-size="9.5" font-weight="700">INT8 Latency: 0.765 ms (RTF 0.153x)</text>
  </g>

  <!-- Connectors from Column 2 to Column 3 (Fusion Controller) -->
  <!-- From NLMS to Fusion -->
  <path d="M 470 140 L 530 140 L 530 230 L 580 230" fill="none" stroke="#f59e0b" stroke-width="2" class="flow-dash-amber" marker-end="url(#arrow-amber)" />
  <text x="480" y="132" fill="#f59e0b" font-size="9.5" font-weight="700">e_nlms[n]</text>

  <!-- From Impulse to Fusion -->
  <path d="M 470 270 L 580 270" fill="none" stroke="#f43f5e" stroke-width="2.2" class="flow-dash-rose" marker-end="url(#arrow-rose)" />
  <text x="480" y="262" fill="#f43f5e" font-size="9.5" font-weight="700">Impulse Flag</text>

  <!-- From ComplexCRN to Fusion -->
  <path d="M 470 425 L 530 425 L 530 310 L 580 310" fill="none" stroke="#a855f7" stroke-width="2" class="flow-dash-purple" marker-end="url(#arrow-purple)" />
  <text x="480" y="418" fill="#c084fc" font-size="9.5" font-weight="700">S_hat(f,t)</text>

  <!-- ==================== COLUMN 3: HYBRID FUSION CONTROLLER ==================== -->
  <g transform="translate(580, 160)">
    <rect x="0" y="0" width="230" height="220" rx="10" fill="#091d24" stroke="#00ff88" stroke-width="2" filter="url(#glow-emerald)" />
    <circle cx="20" cy="24" r="5" fill="#00ff88" />
    <text x="34" y="28" fill="#00ff88" font-size="13.5" font-weight="900">HYBRID FUSION CONTROLLER</text>
    
    <text x="14" y="55" fill="#a7f3d0" font-size="11" font-weight="700">Dynamic Spectral Blending:</text>
    <rect x="14" y="63" width="202" height="26" rx="4" fill="#064e3b" />
    <text x="20" y="80" fill="#6ee7b7" font-size="10" font-family="monospace">S_fused = λ·S_ai + (1-λ)·S_nlms</text>

    <text x="14" y="110" fill="#a7f3d0" font-size="11" font-weight="700">Transient Protection Envelope:</text>
    <text x="14" y="126" fill="#d1fae5" font-size="10">Fast-Attack / Exp-Decay Gate</text>
    <text x="14" y="142" fill="#34d399" font-size="9.5" font-family="monospace">Gain Floor: g_impulse = 0.05</text>

    <text x="14" y="170" fill="#a7f3d0" font-size="11" font-weight="700">6-State Hardware Engine:</text>
    <text x="14" y="186" fill="#6ee7b7" font-size="9.5">NORMAL • IMPULSE_PROTECT</text>
    <text x="14" y="202" fill="#6ee7b7" font-size="9.5">DEGRADED • NLMS_FAULT • BYPASS</text>
  </g>

  <!-- Connector from Fusion to Synthesis -->
  <path d="M 810 270 L 860 270" fill="none" stroke="#00ff88" stroke-width="2.5" class="flow-dash-emerald" marker-end="url(#arrow-emerald)" />
  <text x="815" y="260" fill="#00ff88" font-size="10" font-weight="700">S_fused</text>

  <!-- ==================== COLUMN 4: SYNTHESIS & OUTPUT ==================== -->
  <g transform="translate(860, 160)">
    <!-- iSTFT Overlap-Add Node -->
    <rect x="0" y="0" width="160" height="95" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="14" y="26" fill="#38bdf8" font-size="12" font-weight="800">iSTFT SYNTHESIS</text>
    <text x="14" y="46" fill="#e2e8f0" font-size="10.5">Overlap-Add (OLA)</text>
    <text x="14" y="64" fill="#94a3b8" font-size="10">Hann Window N=512</text>
    <text x="14" y="82" fill="#38bdf8" font-size="9" font-family="monospace">COLA Verified (SNR&gt;100dB)</text>

    <!-- Connector to Output -->
    <path d="M 80 95 L 80 125" fill="none" stroke="#00ff88" stroke-width="2" class="flow-dash-emerald" marker-end="url(#arrow-emerald)" />

    <!-- ALSA Output Node -->
    <rect x="0" y="125" width="160" height="95" rx="8" fill="#06281e" stroke="#10b981" stroke-width="2" filter="url(#glow-emerald)" />
    <circle cx="15" cy="144" r="4" fill="#10b981" class="status-blink" />
    <text x="26" y="148" fill="#34d399" font-size="12" font-weight="800">ALSA PLAYBACK</text>
    <text x="14" y="170" fill="#ecfdf5" font-size="10.5" font-weight="600">Hardware PCM Out</text>
    <text x="14" y="188" fill="#a7f3d0" font-size="10">Enhanced Speech y[n]</text>
    <text x="14" y="206" fill="#34d399" font-size="9.5" font-weight="700">Zero Buffer Overruns</text>
  </g>

  <!-- Bottom Global Summary Footnote -->
  <g transform="translate(40, 525)">
    <line x1="0" y1="0" x2="980" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="18" fill="#64748b" font-size="11">TIMING BUDGET: 5.0 ms hop | MEASURED INT8 LATENCY: 0.765 ms | CPU HEADROOM: 84.7% | TOTAL STACK LATENCY: &lt; 15.0 ms</text>
  </g>
</svg>
