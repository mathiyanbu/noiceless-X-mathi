<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>

    <linearGradient id="noisy-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>

    <linearGradient id="clean-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162238" stroke-width="0.75" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.6)); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 24px rgba(0, 255, 136, 0.9)); }
    }
    @keyframes waveTravelLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-160px); }
    }
    @keyframes waveTravelRight {
      0% { transform: translateX(0); }
      100% { transform: translateX(-160px); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateCore {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1.0); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.9; }
    }
    .neon-title {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .laser-dash {
      stroke-dasharray: 8 6;
      animation: dashStream 1.5s linear infinite;
    }
    .core-ring {
      transform-origin: 500px 175px;
      animation: rotateCore 12s linear infinite;
    }
    .noisy-stream {
      animation: waveTravelLeft 2.5s linear infinite;
    }
    .clean-stream {
      animation: waveTravelRight 2.5s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="360" rx="16" fill="url(#cyber-grid)" />

  <!-- Cyber Border Frame -->
  <rect x="2" y="2" width="996" height="356" rx="14" fill="none" stroke="#1f2f4d" stroke-width="1.5" />
  <path d="M 2 40 L 40 2 M 998 40 L 960 2 M 2 320 L 40 358 M 998 320 L 960 358" stroke="#00f0ff" stroke-width="2.5" fill="none" opacity="0.8" />

  <!-- Top Badges / Metadata Ribbon -->
  <g transform="translate(40, 32)">
    <!-- Real-Time Badge -->
    <rect x="0" y="0" width="130" height="22" rx="11" fill="#13233a" stroke="#00f0ff" stroke-width="1" />
    <circle cx="12" cy="11" r="4" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15" fill="#00f0ff" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700">16 kHz / 5.0ms HOP</text>

    <!-- Architecture Badge -->
    <rect x="140" y="0" width="165" height="22" rx="11" fill="#1b1736" stroke="#7000ff" stroke-width="1" />
    <text x="152" y="15" fill="#c084fc" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700">DUAL-PATH HYBRID AI+NLMS</text>

    <!-- Hardware Badge -->
    <rect x="315" y="0" width="155" height="22" rx="11" fill="#241424" stroke="#ff007f" stroke-width="1" />
    <text x="327" y="15" fill="#ff77bb" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700">RASPBERRY PI 4/5 ARM64</text>

    <!-- Verification Badge -->
    <rect x="740" y="0" width="180" height="22" rx="11" fill="#0c261e" stroke="#00ff88" stroke-width="1" />
    <circle cx="752" cy="11" r="4" fill="#00ff88" />
    <text x="764" y="15" fill="#00ff88" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700">100% ZERO-MOCK CERTIFIED</text>
  </g>

  <!-- Title & Subtitle Banner -->
  <g transform="translate(500, 95)" text-anchor="middle">
    <text class="neon-title" x="0" y="0" font-size="44" fill="url(#title-grad)">NOICELESS-X</text>
    <text x="0" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">
      DUAL-MICROPHONE ADAPTIVE ACOUSTIC SPEECH ENHANCEMENT ENGINE
    </text>
  </g>

  <!-- Central Processing Core Node -->
  <g transform="translate(500, 220)">
    <!-- Pulsing Outer Aura -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.3">
      <animate attributeName="r" values="42;52;42" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.05;0.4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Rotating Cyber Ring -->
    <circle class="core-ring" cx="0" cy="0" r="38" fill="none" stroke="#7000ff" stroke-width="2" stroke-dasharray="16 8 8 8" />
    <circle cx="0" cy="0" r="30" fill="#091322" stroke="#00ff88" stroke-width="2" />
    
    <!-- Core Icon: Microchip / Waveform -->
    <path d="M -12 -12 L 12 -12 L 12 12 L -12 12 Z" fill="#132338" stroke="#00f0ff" stroke-width="1.2" />
    <path d="M -8 0 L -4 6 L 0 -6 L 4 8 L 8 0" fill="none" stroke="#00ff88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="2" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="7" font-weight="800">FUSION</text>
    <text x="0" y="44" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="9" font-weight="700">RTF: 0.153x</text>
  </g>

  <!-- LEFT: Input Noisy Waveform Section -->
  <g transform="translate(60, 160)">
    <!-- Label -->
    <rect x="0" y="0" width="130" height="20" rx="4" fill="#2d1219" stroke="#ff3366" stroke-width="1" />
    <text x="65" y="14" text-anchor="middle" fill="#ff4d79" font-family="'Segoe UI', monospace" font-size="10" font-weight="800">INPUT: NOISY (SNR &lt; 0dB)</text>

    <!-- Clipping Box for Moving Waveform -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="370" height="60" rx="8" fill="#120c15" stroke="#381a29" stroke-width="1" />
      <svg x="5" y="5" width="360" height="50" viewBox="0 0 360 50">
        <g class="noisy-stream">
          <!-- Continuous double waveform pattern -->
          <path d="M 0 25 Q 15 -5 30 25 T 60 25 T 75 48 T 90 25 T 105 -2 T 120 25 T 135 46 T 150 25 T 165 -8 T 180 25 T 195 50 T 210 25 T 225 -5 T 240 25 T 255 48 T 270 25 T 285 -2 T 300 25 T 315 46 T 330 25 T 345 -8 T 360 25 T 375 50 T 390 25 T 405 -5 T 420 25 T 435 48 T 450 25 T 465 -2 T 480 25 T 495 46 T 510 25 T 525 -8 T 540 25" 
                fill="none" stroke="url(#noisy-grad)" stroke-width="2.2" filter="url(#glow-red)" />
        </g>
      </svg>
    </g>

    <!-- Signal Flowing Arrow to Center -->
    <path d="M 370 60 L 440 60" fill="none" stroke="#ff3366" stroke-width="2" class="laser-dash" />
    <polygon points="440,57 447,60 440,63" fill="#ff3366" />
  </g>

  <!-- RIGHT: Output Clean Waveform Section -->
  <g transform="translate(570, 160)">
    <!-- Flowing Arrow from Center -->
    <path d="M -10 60 L 60 60" fill="none" stroke="#00ff88" stroke-width="2" class="laser-dash" />
    <polygon points="60,57 67,60 60,63" fill="#00ff88" />

    <!-- Label -->
    <rect x="240" y="0" width="130" height="20" rx="4" fill="#082b1d" stroke="#00ff88" stroke-width="1" />
    <text x="305" y="14" text-anchor="middle" fill="#00ff88" font-family="'Segoe UI', monospace" font-size="10" font-weight="800">OUTPUT: ENHANCED SPEECH</text>

    <!-- Clipping Box for Moving Clean Waveform -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="370" height="60" rx="8" fill="#081716" stroke="#133d32" stroke-width="1" />
      <svg x="5" y="5" width="360" height="50" viewBox="0 0 360 50">
        <g class="clean-stream">
          <!-- Smooth Clean Harmonic Speech Contours -->
          <path d="M 0 25 C 20 5, 40 5, 60 25 C 80 45, 100 45, 120 25 C 140 10, 160 10, 180 25 C 200 40, 220 40, 240 25 C 260 5, 280 5, 300 25 C 320 45, 340 45, 360 25 C 380 10, 400 10, 420 25 C 440 40, 460 40, 480 25 C 500 5, 520 5, 540 25" 
                fill="none" stroke="url(#clean-grad)" stroke-width="2.5" filter="url(#glow-green)" />
        </g>
      </svg>
    </g>
  </g>

  <!-- Bottom Telemetry Ticker -->
  <g transform="translate(60, 310)">
    <line x1="0" y1="0" x2="880" y2="0" stroke="#1e2d47" stroke-width="1" />
    
    <g transform="translate(10, 20)">
      <text x="0" y="0" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11">MODEL:</text>
      <text x="55" y="0" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">ComplexCRN (1.44M Params, INT8 4.16MB)</text>

      <text x="360" y="0" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11">IMPULSE DETECTOR:</text>
      <text x="495" y="0" fill="#a78bfa" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">TinyImpulseMLP (&lt; 5µs, 100% Prec)</text>

      <text x="730" y="0" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11">STREAMING GAP:</text>
      <text x="835" y="0" fill="#34d399" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">2.15e-06</text>
    </g>
  </g>
</svg>
